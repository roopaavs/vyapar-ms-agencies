workflows:
  android-release:
    name: Vyapar Billing APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fix full project structure
        script: |
          mkdir -p /tmp/bak
          cp main.dart /tmp/bak/ 2>/dev/null || true
          cp *_screen.dart /tmp/bak/ 2>/dev/null || true
          cp *_provider.dart /tmp/bak/ 2>/dev/null || true
          cp *.dart /tmp/bak/ 2>/dev/null || true
          ls -la
          flutter create . --platforms=android --project-name vyapar_app
          mkdir -p lib
          cp /tmp/bak/* lib/ 2>/dev/null || true
          mv lib/main.dart lib/main.dart 2>/dev/null || true
          ls -la lib/
          ls -la android/app/
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
