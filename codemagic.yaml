workflows:
  android-release:
    name: Vyapar Billing APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build Fresh Vyapar App
        script: |
          rm -rf android ios lib
          flutter create . --project-name vyapar_app --org com.msagencies.vyapar --platforms=android
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          void main() => runApp(VyaparApp());
          class VyaparApp extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Vyapar MS Agencies',
                theme: ThemeData(primarySwatch: Colors.blue),
                home: HomePage(),
              );
            }
          }
          class HomePage extends StatelessWidget {
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text('Vyapar MS Agencies'), backgroundColor: Colors.blue),
                body: ListView(
                  padding: EdgeInsets.all(16),
                  children: [
                    Card(child: ListTile(leading: Icon(Icons.receipt, color: Colors.blue, size: 40), title: Text('Create Invoice'), subtitle: Text('GST Billing'))),
                    Card(child: ListTile(leading: Icon(Icons.inventory, color: Colors.green, size: 40), title: Text('Products & Stock'), subtitle: Text('Manage inventory'))),
                    Card(child: ListTile(leading: Icon(Icons.people, color: Colors.orange, size: 40), title: Text('Parties'), subtitle: Text('Customers & Suppliers'))),
                    Card(child: ListTile(leading: Icon(Icons.bar_chart, color: Colors.purple, size: 40), title: Text('Reports'), subtitle: Text('Sales & GST Reports'))),
                    SizedBox(height: 20),
                    Center(child: Text('APK Build Success! 🎉', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.green))),
                  ],
                ),
              );
            }
          }
          DART
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
