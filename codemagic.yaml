workflows:
  android-release:
    name: Real Vyapar with DB
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.22.3
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build REAL with Customer & Product DB
        script: |
          rm -rf android ios lib pubspec.yaml
          git clone https://github.com/Lazdisas/vyapar-flutter-app.git /tmp/orig
          cp -r /tmp/orig/android .
          cp -r /tmp/orig/lib .
          cp /tmp/orig/pubspec.yaml .
          ls lib/database/
          ls lib/models/
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
