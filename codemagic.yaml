workflows:
  android-release:
    name: Real Vyapar with DB - Fixed
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.22.3
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build REAL with Customer & Product DB
        script: |
          rm -rf android ios lib pubspec.yaml pubspec.lock
          git clone https://github.com/Lazdisas/vyapar-flutter-app.git /tmp/orig
          cp -r /tmp/orig/android .
          cp -r /tmp/orig/lib .
          cp /tmp/orig/pubspec.yaml .
          
          # Patch pubspec to work with Flutter 3.22.3
          cat > pubspec.yaml <<'YAML'
          name: vyapar_app
          description: Vyapar Real Billing App with Customer Product DB
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: ">=3.2.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            provider: ^6.1.2
            sqflite: ^2.3.3
            path: ^1.8.3
            intl: ^0.19.0
            shared_preferences: ^2.2.2
            fl_chart: ^0.68.0
            sqflite_common_ffi: ^2.3.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
          YAML

          ls lib/database/
          ls lib/models/
          ls android/app/build.gradle

      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
