workflows:
  android-release:
    name: Vyapar Billing APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.22.2
      xcode: 15.4
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build Release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
